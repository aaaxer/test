<!DOCTYPE html>
<html lang="cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="dec.css">
    <link rel="icon" href="B6EBA28C06B07F0FFE8823BD162E488F.jpg" sizes="32*32">
    <title>Rubserniv</title>
</head>
<body>
    <div id="IDcard">
        <img src="1786426457962.png" alt="头像" style="display: inline-block;">
        <h1 style="display: inline;">Rubserniv</h1>
    </div>
    <div class="chance">
        <div class="option"></div>
        <p>换颜色</p>
    </div>
    <div class="chance">
        <div class="option"></div>
        <p>55</p>
    </div>
    <div class="chance">
        <div class="option"></div>
        <p>55</p>
    </div>
    <script>
        const root = document.documentElement;
        document.querySelectorAll(".chance").forEach(el => {
            el.addEventListener('click',function(){
                const color1 = getComputedStyle(root).getPropertyValue('--bgcolor').trim();
                const color2 = getComputedStyle(root).getPropertyValue('--textcolor').trim();                 
                root.style.setProperty('--bgcolor',color2);
                root.style.setProperty('--textcolor', color1);
        });
    });
    </script>
</body>
</html>
