<style>
    body {
        background: linear-gradient(to right,rgb(242, 77, 121),rgb(50, 50, 175),rgb(10, 167, 167),rgb(192, 253, 24));
    }
    .completed{
        text-decoration: line-through;
        opacity: 0.4;
    }
    .del{
        color: red;
    }
    .item{
        display: flex;
        text-align: center;
        box-sizing: border-box;
        width: 80%;
        height: 50px;
        margin: 16px auto;
        padding: 16px;
        box-shadow: rgba(149, 157, 165, 1) 0px 8px 20px;
        border-radius: 20px;
        justify-content: space-between;
    }
    .todo-button{
        height: 52px;
        width: 100px;
        background: linear-gradient(to right,rgb(242, 77, 121) 45%,rgb(50, 50, 175));
        border-radius:  0 20px 20px 0;
        text-align: center;
        color: #ffff;
        line-height: 50px;
        cursor: pointer;
        user-select: none;
    }
    .todo-input{
        border: 1px solid #dfe1e5;
        outline: none;
        width: 60%;
        height: 50px;
        border-radius: 20px 0 0 20px;
        padding-left: 15px;
        margin-bottom: 20px;
    }
    .todo-from{
        display: flex;
        margin-top: 20px;
        margin-left: 30px;
    }
    .todo-app{
        width: 98%;
        height: 500px;
        background-color:#ffff;
        border-radius: 5px;
        padding-top: 30px;
        box-sizing: border-box;
        margin-left: 1%;
    }
    .title{
        font-size: 30px;
        font-weight: 700;
        text-align: center;
    }
